name: Testar e publicar Komorebi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter o projeto
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Testar as regras do jogo
        run: npm test

      - name: Instalar Chromium para os testes
        run: npx playwright install --with-deps chromium

      - name: Testar o jogo no navegador
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Gerar o jogo para produção
        run: npm run build

      - name: Gerar o arquivo para baixar e jogar offline
        run: npm run build:download

      - name: Testar o PWA de produção no celular e offline
        run: npm run test:pwa
        env:
          CI: 'true'

      - name: Guardar evidências se um teste falhar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencias-dos-testes
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preparar o artefato do Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa02 # v3
        with:
          path: dist

  iphone:
    name: Verificar iPhone com WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obter o projeto
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar WebKit
        run: npx playwright install --with-deps webkit
      - name: Gerar o jogo
        run: npm run build
      - name: Testar no motor do Safari com perfil de iPhone
        run: npm run test:webkit
        env:
          CI: 'true'
      - name: Resumir a verificação do iPhone
        if: always()
        run: node scripts/summarize-webkit.mjs
      - name: Guardar evidências do WebKit
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidencias-webkit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, iphone]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publicar o jogo validado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
